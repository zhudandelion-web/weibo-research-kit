name: guest-smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Bounded guest check, metadata only
        run: python scripts/guest_smoke.py smoke-status.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guest-status
          path: smoke-status.json
          retention-days: 14
