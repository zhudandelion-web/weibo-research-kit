[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-research-kit"
version = "0.1.0a1"
description = "Guest-only Weibo MCP tools with a private, traceable research archive"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp-server-weibo==1.3.4", "fastmcp==4.1.0", "platformdirs>=4,<5"]

[project.scripts]
weibo-research = "weibo_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*"]
